name: Fetch Release Notes

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 7am UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  fetch-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Fetch and process release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAILS_ENV: production
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'placeholder-for-rake-task' }}
        run: bundle exec rake releases:fetch_all

      - name: Commit updated releases data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/releases_data.json
          git diff --staged --quiet && echo "No changes to commit." || (git commit -m "chore: update release notes [skip ci]" && git push)
