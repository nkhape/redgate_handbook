name: fetch latest release notes

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Fetch latest release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ruby fetch_releases.rb

      - name: Regenerate static site
        run: ruby generate.rb

      - name: Commit changes, one commit per product that actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u +"%Y/%m/%d-%H:%MUTC")
          COMMITTED=false

          declare -A PRODUCT_NAMES=( [monitor]="Monitor" [flyway]="Flyway" )

          for key in "${!PRODUCT_NAMES[@]}"; do
            name="${PRODUCT_NAMES[$key]}"
            json="data/releases/${key}.json"

            if [ -n "$(git status --porcelain -- "$json")" ]; then
              git add "$json" "public/products/${key}/index.html" "public/de/products/${key}/index.html"
              git commit -m "${TIMESTAMP}_${name}_release-note-updates"
              COMMITTED=true
            fi
          done

          if [ "$COMMITTED" = true ]; then
            git push
          else
            echo "No release note changes found."
          fi
