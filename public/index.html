<!DOCTYPE html>
<html>
  <head>
    <title>Redgate Handbook</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">
  </head>
  <body class="bg-white min-h-screen font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-[#111827] text-white px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-white font-semibold text-lg tracking-tight hover:text-[#e8392d] transition">
        <span class="text-[#e8392d]">Redgate</span> Handbook
      </a>

      <div class="flex gap-6 text-sm font-medium">
        
          <a href="/products/monitor/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Monitor</a>
        
          <a href="/products/flyway/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Flyway</a>
        
          <a href="/products/toolbelt_essentials/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Toolbelt Essentials</a>
        
      </div>
    </nav>

    <main>
      <div class="max-w-6xl mx-auto px-6 py-12">
  <h1 class="text-4xl font-bold text-gray-900 mb-2">Redgate Product Handbook</h1>
  <p class="text-lg text-gray-500 mb-10">Quick reference for sales & solutions teams</p>

  
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    
      <a href="/products/monitor/" class="block bg-white border border-gray-200 rounded-xl p-6 card-hover group">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2 group-hover:underline" style="text-decoration-color:#e8392d;">
              Redgate Monitor
            </h2>
            <p class="text-gray-500 text-sm">Full visibility into your entire database estate</p>
          </div>
          
            <img src="/images/logos/Monitor_logo.svg" alt="Redgate Monitor" class="w-auto ml-6 flex-shrink-0" style="height:40px;" />
          
        </div>
      </a>
    
      <a href="/products/flyway/" class="block bg-white border border-gray-200 rounded-xl p-6 card-hover group">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2 group-hover:underline" style="text-decoration-color:#e8392d;">
              Redgate Flyway
            </h2>
            <p class="text-gray-500 text-sm">Database migrations made easy</p>
          </div>
          
            <img src="/images/logos/Flyway_logo.svg" alt="Redgate Flyway" class="w-auto ml-6 flex-shrink-0" style="height:40px;" />
          
        </div>
      </a>
    
  </div>
</div>

    </main>

  </body>
</html>
