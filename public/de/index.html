<!DOCTYPE html>
<html lang="de">
  <head>
    <title>Redgate Handbook</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="/redgate_handbook/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/redgate_handbook/css/tailwind.css">
  </head>
  <body class="bg-white min-h-screen font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-[#111827] text-white px-6 py-4 flex items-center justify-between">
      <a href="/redgate_handbook/de/" class="text-white font-semibold text-lg tracking-tight hover:text-[#e8392d] transition">
        <span class="text-[#e8392d]">Redgate</span> Handbook
      </a>

      <div class="flex items-center gap-6 text-sm font-medium">
        
          <a href="/redgate_handbook/de/products/monitor/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Monitor</a>
        
          <a href="/redgate_handbook/de/products/flyway/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Flyway</a>
        
          <a href="/redgate_handbook/de/products/toolbelt_essentials/" class="transition hover:underline text-gray-300 hover:text-white" style="text-decoration-color:#e8392d;">Toolbelt Essentials</a>
        

        <div class="flex items-center gap-2 pl-4 border-l border-gray-700">
          <a href="/redgate_handbook/" class="rounded-sm overflow-hidden transition grayscale opacity-45 hover:grayscale-50 hover:opacity-75 " aria-label="English" title="English">
            <svg width="20" height="14" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" class="block">
              <rect width="30" height="20" fill="#012169"/>
              <path d="M0,0 L30,20 M30,0 L0,20" stroke="#FFFFFF" stroke-width="4"/>
              <path d="M0,0 L30,20 M30,0 L0,20" stroke="#C8102E" stroke-width="1.5"/>
              <path d="M15,0 V20 M0,10 H30" stroke="#FFFFFF" stroke-width="6"/>
              <path d="M15,0 V20 M0,10 H30" stroke="#C8102E" stroke-width="3.5"/>
            </svg>
          </a>
          <a href="/redgate_handbook/de/" class="rounded-sm overflow-hidden transition grayscale opacity-45 hover:grayscale-50 hover:opacity-75 !grayscale-0 !opacity-100" aria-label="Deutsch" title="Deutsch">
            <svg width="20" height="14" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" class="block">
              <rect width="30" height="6.67" y="0" fill="#000000"/>
              <rect width="30" height="6.67" y="6.67" fill="#DD0000"/>
              <rect width="30" height="6.67" y="13.33" fill="#FFCE00"/>
            </svg>
          </a>
        </div>
      </div>
    </nav>

    <main>
      <div class="max-w-6xl mx-auto px-6 py-12">
  <h1 class="text-4xl font-bold text-gray-900 mb-2">Redgate Product Handbook</h1>
  <p class="text-lg text-gray-500 mb-10">Schnellübersicht für Vertriebs- und Lösungsteams</p>

  
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    
      <a href="/redgate_handbook/de/products/monitor/" class="block bg-white border border-gray-200 rounded-xl p-6 card-hover group">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2 group-hover:underline" style="text-decoration-color:#e8392d;">
              Redgate Monitor
            </h2>
            <p class="text-gray-500 text-sm">Volle Transparenz über Ihren gesamten Datenbankbestand</p>
          </div>
          
            <img src="/redgate_handbook/images/logos/Monitor_logo.svg" alt="Redgate Monitor" class="w-auto ml-6 flex-shrink-0" style="height:40px;" />
          
        </div>
      </a>
    
      <a href="/redgate_handbook/de/products/flyway/" class="block bg-white border border-gray-200 rounded-xl p-6 card-hover group">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2 group-hover:underline" style="text-decoration-color:#e8392d;">
              Redgate Flyway
            </h2>
            <p class="text-gray-500 text-sm">Datenbankmigrationen leicht gemacht</p>
          </div>
          
            <img src="/redgate_handbook/images/logos/Flyway_logo.svg" alt="Redgate Flyway" class="w-auto ml-6 flex-shrink-0" style="height:40px;" />
          
        </div>
      </a>
    
  </div>
</div>
