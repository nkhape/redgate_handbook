    test_data_manager:
      name: "Redgate Test Data Manager"
      tagline: "Safe, realistic test data on demand"
      description: "Test Data Manager helps teams provision masked, compliant, and production-like data for testing — without exposing real customer data. Developers and QA engineers get the data they need, self-service, without waiting on a DBA or risking a GDPR breach."
      features:
        masking:
          title: "Data Masking & Anonymisation"
          description: "Replace sensitive production data with realistic synthetic values — names, emails, addresses, card numbers — while preserving the shape and referential integrity of the data. The result looks real, behaves real, and contains nothing it shouldn't."
          points:
            - title: "Deterministic masking"
              text: "The same input always produces the same masked output, so joins still work across tables."
            - title: "Format-preserving"
              text: "Masked values match the format of the original — so application validation still passes."
            - title: "Custom masking rules"
              text: "Define your own masking logic for domain-specific fields."
        provisioning:
          title: "Self-Service Provisioning"
          description: "Developers and testers request the data they need without raising a ticket or waiting on a DBA. Provision a fresh, masked copy of a database in minutes — not days."
          points:
            - title: "On-demand clones"
              text: "Spin up a masked database copy for any environment, any time."
            - title: "Subsetting"
              text: "Provision a representative slice of production data — not the full 10TB — keeping test environments lean and fast."
            - title: "CI/CD integration"
              text: "Automate data provisioning as part of your pipeline so every test run starts with clean, consistent data."
        compliance:
          title: "Compliance & Governance"
          description: "Built for teams who need to demonstrate compliance with GDPR, HIPAA, and other data privacy regulations. Every provisioning action is logged and auditable."
          points:
            - title: "GDPR-ready"
              text: "No PII ever leaves production unmasked — full audit trail of what was provisioned and to whom."
            - title: "Policy enforcement"
              text: "Define organisation-wide masking policies that can't be bypassed by individual teams."
            - title: "Data classification"
              text: "Automatically detect and tag sensitive columns across your database estate."
        cicd:
          title: "CI/CD & Pipeline Integration"
          description: "Test Data Manager fits into the pipelines you already have. Provision fresh test data automatically on every build — no manual prep, no stale snapshots."
          points:
            - title: "REST API"
              text: "Trigger provisioning from any pipeline tool — Jenkins, GitHub Actions, Azure DevOps, and more."
            - title: "CLI"
              text: "Script provisioning steps alongside your deployment automation."
            - title: "Supports SQL Server and Oracle"
              text: "With more databases on the roadmap."
      platforms:
        - name: "SQL Server"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
        - name: "Oracle"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/oracle/oracle-original.svg"
      audience: "QA teams, developers, and compliance officers who need realistic test data without the risk of exposing PII."
      links:
        - title: "Test Data Manager Overview"
          url: "https://www.red-gate.com/products/test-data-manager/"
        - title: "Documentation"
          url: "https://documentation.red-gate.com/test-data-manager"

    toolbelt_essentials:
      name: "SQL Toolbelt Essentials"
      tagline: "The essential toolkit for SQL Server developers"
      description: "SQL Toolbelt Essentials bundles Redgate's most-used SQL Server tools into one package — schema comparison, data comparison, intelligent autocomplete, and fast object search. The tools that SQL Server developers reach for every day, at a bundled price."
      features:
        sql_compare:
          title: "SQL Compare"
          description: "Compare and deploy SQL Server database schemas in minutes. See exactly what's different between two databases, generate a deployment script, and apply it — with a full preview before anything changes."
          points:
            - title: "Schema diff"
              text: "Side-by-side comparison of any two SQL Server databases, scripts, or source-control folders."
            - title: "Deployment script generation"
              text: "Generate a safe, ordered deployment script with a single click — or run it directly."
            - title: "Source control integration"
              text: "Compare against a scripts folder in Git to keep schema and code in sync."
              url: "https://documentation.red-gate.com/sc"
        sql_data_compare:
          title: "SQL Data Compare"
          description: "Compare and synchronise data between SQL Server databases at the row level. Find exactly which rows differ, and deploy only what's changed — ideal for keeping reference data and lookup tables in sync across environments."
          points:
            - title: "Row-level diff"
              text: "See insertions, updates, and deletions between any two databases."
            - title: "Selective deployment"
              text: "Choose exactly which rows to synchronise — you're always in control."
            - title: "Backup-to-live comparison"
              text: "Compare a live database against a backup to understand what changed."
        sql_prompt:
          title: "SQL Prompt"
          description: "Intelligent autocomplete, code formatting, and snippet management for SQL Server Management Studio and Azure Data Studio. Write SQL faster and with fewer mistakes."
          points:
            - title: "Context-aware autocomplete"
              text: "Suggestions that understand your schema — tables, columns, aliases, and more."
            - title: "Code formatting"
              text: "Instantly reformat any SQL to your team's style guide with a single shortcut."
            - title: "Snippets"
              text: "Save and reuse boilerplate SQL — common queries, templates, and patterns."
            - title: "SQL Prompt for VS Code"
              text: "Now available as a VS Code extension."
              url: "https://marketplace.visualstudio.com/items?itemName=red-gate.sql-prompt"
        sql_search:
          title: "SQL Search"
          description: "Find any database object — tables, columns, stored procedures, views — across all databases on a server in seconds. Free SSMS plugin, included in Toolbelt Essentials."
          points:
            - title: "Search across all databases"
              text: "One search box, every object on the server — no need to expand the object explorer one database at a time."
            - title: "Find dependencies"
              text: "See what references an object before you change or drop it."
            - title: "Free download"
              text: "SQL Search is also available as a standalone free tool."
              url: "https://www.red-gate.com/products/sql-search/"
      platforms:
        - name: "SQL Server"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
      audience: "SQL Server developers and DBAs who want Redgate's core productivity tools in a single bundle."
      links:
        - title: "SQL Toolbelt Essentials Overview"
          url: "https://www.red-gate.com/products/sql-toolbelt-essentials/"
        - title: "SQL Compare Documentation"
          url: "https://documentation.red-gate.com/sc"
        - title: "SQL Prompt Documentation"
          url: "https://documentation.red-gate.com/sp"
        - title: "SQL Search (free download)"
          url: "https://www.red-gate.com/products/sql-search/"
