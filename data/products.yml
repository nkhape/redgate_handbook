en:
  products:
    flyway:
      name: "Redgate Flyway"
      tagline: "Database migrations made easy"
      description: "Flyway is an open-source database migration tool that lets teams version-control their schema changes alongside application code. It applies migrations in order, tracks what's been run, and integrates with any CI/CD pipeline — so your database moves with your code, every time."
      features:
        migrations:
          title: "Database Version Control"
          description: "Every database change is version-controlled — written down, ordered, and tracked, just like application code. No guessing what's been applied where."
          image: "/images/flyway/migration-script.png"
          points:
            - title: "Works however you want"
              text: "Either way, Flyway generates the actual deployment script for you — respecting dependencies and applying changes in the right order."
              sub_points:
                - title: "Migrations-based"
                  text: "Write out each change, step by step."
                  url: "https://documentation.red-gate.com/fd/choosing-the-right-approach-with-flyway-246972498.html#ChoosingtherightapproachwithFlyway-Migrations-basedapproachwithauto-generationofmigrationscripts"
                - title: "State-based"
                  text: "Describe the end result — Flyway works out how to get there."
                  url: "https://documentation.red-gate.com/fd/choosing-the-right-approach-with-flyway-246972498.html#ChoosingtherightapproachwithFlyway-State-basedapproach"
            - title: "Ordered & tracked"
              text: "Every change runs in the same order, on every environment, every time."
            - title: "Undo when needed"
              text: "Roll back a change cleanly instead of writing a manual fix."
        cicd:
          title: "CI/CD Integration"
          description: "Flyway plugs straight into the pipelines your team already uses, so migrations run automatically and identically on every deploy — no manual steps, no \"works on my machine.\""
          image: "/images/flyway/pipeline.png"
          points:
            - title: "Fits any pipeline"
              text: "Installs as a simple command-line tool, so it fits into almost any build or deployment process."
            - title: "Works with what you have"
              text: "GitHub Actions, Jenkins, Azure DevOps, and more."
        quality_gates:
          title: "Quality Gates"
          description: "Nothing reaches production without a check first."
          image: "/images/flyway/rules.png"
          points:
            - title: "Dry runs"
              text: "See exactly what will change before it touches the database."
            - title: "Automatic checks"
              text: "Use pre-built checks, or add your own easily, to flag risky or non-compliant changes before they're deployed."
            - title: "Sign-off required"
              text: "Sensitive environments can require manual approval before going ahead."
        visibility:
          title: "Visibility & Reporting"
          description: "One place to see the health and history of every database deployment — not just for the person who ran it."
          image: "/images/flyway/report.png"
          points:
            - title: "Deployment dashboard"
              text: "See what's been deployed, when, and where, across every project and environment."
            - title: "Reports for every deployment"
              text: "What changed can be reviewed before a deployment is approved."
            - title: "Drift alerts"
              text: "Get notified if a database changes outside Flyway's control."
            - title: "Full audit trail"
              text: "Know who did what, when, and why."
      platforms:
        - name: "SQL Server"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
        - name: "PostgreSQL"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/postgresql/postgresql-original.svg"
        - name: "MySQL"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg"
        - name: "Oracle"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/oracle/oracle-original.svg"
        - name: "MariaDB"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mariadb/mariadb-original.svg"
      platforms_note:
        text: "plus 50+ more with foundational support"
        url: "https://documentation.red-gate.com/fd/supported-databases-and-versions-143754067.html"
      audience: "DevOps engineers, DBAs, and development teams who need to manage database changes safely across environments."
      links:
        - title: "Flyway Documentation"
          url: "https://documentation.red-gate.com/flyway"
        - title: "First Steps: Flyway Autopilot Beginner's Guide"
          url: "https://documentation.red-gate.com/fd/first-steps-flyway-autopilot-a-beginners-guide-254152325.html"
        - title: "Community vs. Enterprise Edition"
          url: "https://www.red-gate.com/products/flyway/editions/"

    monitor:
      name: "Redgate Monitor"
      tagline: "Full visibility into your entire database estate"
      description: "Redgate Monitor provides real-time monitoring and alerting for SQL Server, PostgreSQL, Oracle, MongoDB and MySQL — whether on-premise or in the cloud. It gives DBAs and ops teams a single pane of glass to catch performance issues before they impact users."
      features:
        global_dashboard:
          title: "Global Dashboard"
          description: "See your entire DB estate, all on one page. No matter if SQL Server, Postgres, MongoDB, MySQL — no matter if on-premise or in the Cloud."
          link_url: "https://monitor.red-gate.com/GlobalDashboard"
          link_title: "Open Global Dashboard"
          image: "/images/monitor/global-dashboard.png"
        server_overview:
          title: "Server Overview Page"
          description: "Timeline of everything that happened on a server, showing current and past performance and events — move the time-frame and all information gets updated. Shows which queries could be improved, and how (with or without AI). Very useful for Root Cause Analysis."
          image: "/images/monitor/server-overview.png"
        alerts:
          title: "Alerts"
          image: "/images/monitor/alerts.png"
          points:
            - title: "Alert Inbox"
              text: "All alerts that were received, across all servers."
              url: "https://monitor.red-gate.com/Alerts/Inbox"
            - title: "Edit Alert Configuration"
              text: "Change alert threshold, to avoid alert fatigue (can also be done automatically for some alerts using Machine Learning)."
              url: "https://monitor.red-gate.com/Configuration/Alerts/EditAlertConfigurations?baseMonitorName=RGMON-EC2-BM2&channelInstanceRefs=i&types=1%3A0&pairs=0%2C0&returnUrl=%2FConfiguration%2FAlerts"
            - title: "Custom Metrics"
              text: "Need something specific? Collect and alert on your own metrics."
              url: "https://sqlmonitormetrics.red-gate.com/"
        enterprise:
          title: "Monitor Enterprise"
          image: "/images/monitor/enterprise.png"
          points:
            - title: "Data API"
              text: "Send data from Monitor anywhere you need it (e.g. PowerBI to analyze)."
            - title: "High Availability"
              text: "Ensures uninterrupted DB monitoring."
            - title: "Permissions"
              text: "Full audit of who has permissions in your estate, including historical changes."
              url: "https://monitor.red-gate.com/Security/Permissions"
            - title: "Configuration Compliance"
              text: "Easily benchmark which Servers / DBs are compliant, and which ones are not."
              url: "https://monitor.red-gate.com/Security/ConfigurationCompliance"
      demo_servers:
        - platform: "SQL Server"
          name: "Demo – Workload01"
