toolbelt_essentials:
  name: "SQL Toolbelt Essentials"
  tagline: "Das essenzielle Toolkit für SQL-Server-Entwickler"
  description: "SQL Toolbelt Essentials bündelt die meistgenutzten SQL-Server-Tools von Redgate in einem Paket — Schemavergleich, Datenvergleich, intelligente Autovervollständigung und schnelle Objektsuche. Die Tools, zu denen SQL-Server-Entwickler täglich greifen, zum gebündelten Preis."
  features:
    sql_compare:
      title: "SQL Compare"
      description: "Vergleichen und bereitstellen von SQL-Server-Datenbankschemas in wenigen Minuten. Sehen Sie genau, was sich zwischen zwei Datenbanken unterscheidet, generieren Sie ein Deployment-Skript und wenden Sie es an — mit vollständiger Vorschau, bevor sich etwas ändert."
      points:
        - title: "Schema-Diff"
          text: "Side-by-Side-Vergleich beliebiger zweier SQL-Server-Datenbanken, Skripte oder Quellcode-Ordner."
        - title: "Generierung von Deployment-Skripten"
          text: "Generieren Sie mit einem Klick ein sicheres, geordnetes Deployment-Skript — oder führen Sie es direkt aus."
        - title: "Versionskontroll-Integration"
          text: "Vergleichen Sie gegen einen Skriptordner in Git, um Schema und Code synchron zu halten."
          url: "https://documentation.red-gate.com/sc"
    sql_data_compare:
      title: "SQL Data Compare"
      description: "Vergleichen und synchronisieren Sie Daten zwischen SQL-Server-Datenbanken auf Zeilenebene. Finden Sie genau, welche Zeilen sich unterscheiden, und stellen Sie nur das bereit, was sich geändert hat — ideal, um Referenzdaten und Nachschlagetabellen über Umgebungen hinweg synchron zu halten."
      points:
        - title: "Zeilengenauer Diff"
          text: "Sehen Sie Einfügungen, Aktualisierungen und Löschungen zwischen zwei beliebigen Datenbanken."
        - title: "Selektives Deployment"
          text: "Wählen Sie genau, welche Zeilen synchronisiert werden — Sie behalten immer die Kontrolle."
        - title: "Vergleich von Backup und Live-Datenbank"
          text: "Vergleichen Sie eine Live-Datenbank mit einem Backup, um zu verstehen, was sich geändert hat."
    sql_prompt:
      title: "SQL Prompt"
      description: "Intelligente Autovervollständigung, Code-Formatierung und Snippet-Verwaltung für SQL Server Management Studio und Azure Data Studio. Schreiben Sie SQL schneller und mit weniger Fehlern."
      points:
        - title: "Kontextbezogene Autovervollständigung"
          text: "Vorschläge, die Ihr Schema verstehen — Tabellen, Spalten, Aliasnamen und mehr."
        - title: "Code-Formatierung"
          text: "Formatieren Sie beliebiges SQL sofort mit einem einzigen Tastenkürzel im Stil Ihres Teams."
        - title: "Snippets"
          text: "Speichern und wiederverwenden Sie Boilerplate-SQL — gängige Abfragen, Vorlagen und Muster."
        - title: "SQL Prompt für VS Code"
          text: "Jetzt auch als VS-Code-Erweiterung verfügbar."
          url: "https://marketplace.visualstudio.com/items?itemName=red-gate.sql-prompt"
    sql_search:
      title: "SQL Search"
      description: "Finden Sie jedes Datenbankobjekt — Tabellen, Spalten, gespeicherte Prozeduren, Views — serverübergreifend in Sekunden. Kostenloses SSMS-Plugin, enthalten in Toolbelt Essentials."
      points:
        - title: "Suche über alle Datenbanken"
          text: "Eine Suchleiste, jedes Objekt auf dem Server — kein Durchklicken des Objekt-Explorers Datenbank für Datenbank mehr nötig."
        - title: "Abhängigkeiten finden"
          text: "Sehen Sie, was auf ein Objekt verweist, bevor Sie es ändern oder löschen."
        - title: "Kostenloser Download"
          text: "SQL Search ist auch als eigenständiges kostenloses Tool verfügbar."
          url: "https://www.red-gate.com/products/sql-search/"
  platforms:
    - name: "SQL Server"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
  audience: "SQL-Server-Entwickler und DBAs, die Redgates zentrale Produktivitätstools in einem Bundle wollen."
  links:
    - title: "SQL Toolbelt Essentials – Übersicht"
      url: "https://www.red-gate.com/products/sql-toolbelt-essentials/"
    - title: "SQL-Compare-Dokumentation"
      url: "https://documentation.red-gate.com/sc"
    - title: "SQL-Prompt-Dokumentation"
      url: "https://documentation.red-gate.com/sp"
    - title: "SQL Search (kostenloser Download)"
      url: "https://www.red-gate.com/products/sql-search/"
