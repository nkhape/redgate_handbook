flyway:
  name: "Redgate Flyway"
  tagline: "Datenbankmigrationen leicht gemacht"
  description: "Flyway ist ein Open-Source-Tool für Datenbankmigrationen, mit dem Teams ihre Schemaänderungen zusammen mit dem Anwendungscode versionieren können. Es wendet Migrationen in der richtigen Reihenfolge an, verfolgt, was bereits ausgeführt wurde, und lässt sich in jede CI/CD-Pipeline integrieren — damit sich Ihre Datenbank jedes Mal zusammen mit Ihrem Code weiterentwickelt."
  features:
    migrations:
      title: "Datenbank-Versionskontrolle"
      description: "Jede Datenbankänderung wird versioniert — festgehalten, geordnet und nachverfolgt, genau wie Anwendungscode. Kein Rätselraten mehr, was wo bereits angewendet wurde."
      image: "/images/flyway/migration-script.png"
      points:
        - title: "Funktioniert, wie Sie es möchten"
          text: "In beiden Fällen generiert Flyway das eigentliche Deployment-Skript für Sie — unter Berücksichtigung von Abhängigkeiten und in der richtigen Reihenfolge."
          sub_points:
            - title: "Migrationsbasiert"
              text: "Jede Änderung Schritt für Schritt festhalten."
              url: "https://documentation.red-gate.com/fd/choosing-the-right-approach-with-flyway-246972498.html#ChoosingtherightapproachwithFlyway-Migrations-basedapproachwithauto-generationofmigrationscripts"
            - title: "Zustandsbasiert"
              text: "Beschreiben Sie das Endergebnis — Flyway findet heraus, wie es dorthin kommt."
              url: "https://documentation.red-gate.com/fd/choosing-the-right-approach-with-flyway-246972498.html#ChoosingtherightapproachwithFlyway-State-basedapproach"
        - title: "Geordnet & nachverfolgt"
          text: "Jede Änderung läuft in derselben Reihenfolge, in jeder Umgebung, jedes Mal."
        - title: "Bei Bedarf rückgängig machen"
          text: "Eine Änderung sauber zurückrollen, statt einen manuellen Fix zu schreiben."
    cicd:
      title: "CI/CD-Integration"
      description: "Flyway fügt sich nahtlos in die Pipelines ein, die Ihr Team bereits verwendet, sodass Migrationen bei jedem Deployment automatisch und identisch ablaufen — keine manuellen Schritte, kein „Bei mir funktioniert's\"."
      image: "/images/flyway/pipeline.png"
      points:
        - title: "Passt in jede Pipeline"
          text: "Installiert sich als einfaches Kommandozeilen-Tool und fügt sich so in fast jeden Build- oder Deployment-Prozess ein."
        - title: "Funktioniert mit dem, was Sie bereits haben"
          text: "GitHub Actions, Jenkins, Azure DevOps und mehr."
    quality_gates:
      title: "Qualitäts-Gates"
      description: "Nichts erreicht die Produktion ohne vorherige Prüfung."
      image: "/images/flyway/rules.png"
      points:
        - title: "Trockenläufe"
          text: "Sehen Sie genau, was sich ändert, bevor es die Datenbank betrifft."
        - title: "Automatische Prüfungen"
          text: "Nutzen Sie vorgefertigte Prüfungen oder fügen Sie eigene hinzu, um riskante oder nicht konforme Änderungen vor dem Deployment zu erkennen."
        - title: "Freigabe erforderlich"
          text: "Sensible Umgebungen können eine manuelle Freigabe vor der Ausführung verlangen."
    visibility:
      title: "Transparenz & Reporting"
      description: "Ein zentraler Ort, um den Zustand und die Historie jedes Datenbank-Deployments einzusehen — nicht nur für die Person, die es ausgeführt hat."
      image: "/images/flyway/report.png"
      points:
        - title: "Deployment-Dashboard"
          text: "Sehen Sie, was wann und wo bereitgestellt wurde, über jedes Projekt und jede Umgebung hinweg."
        - title: "Reports für jedes Deployment"
          text: "Änderungen können vor der Freigabe eines Deployments überprüft werden."
        - title: "Drift-Warnungen"
          text: "Erhalten Sie eine Benachrichtigung, wenn sich eine Datenbank außerhalb der Kontrolle von Flyway ändert."
        - title: "Vollständiger Audit-Trail"
          text: "Wissen Sie, wer was wann und warum getan hat."
  platforms:
    - name: "SQL Server"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
    - name: "PostgreSQL"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/postgresql/postgresql-original.svg"
    - name: "MySQL"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg"
    - name: "Oracle"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/oracle/oracle-original.svg"
    - name: "MariaDB"
      icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mariadb/mariadb-original.svg"
  platforms_note:
    text: "sowie 50+ weitere mit grundlegender Unterstützung"
    url: "https://documentation.red-gate.com/fd/supported-databases-and-versions-143754067.html"
  audience: "DevOps-Ingenieure, DBAs und Entwicklungsteams, die Datenbankänderungen sicher über mehrere Umgebungen hinweg verwalten müssen."
  links:
    - title: "Flyway-Dokumentation"
      url: "https://documentation.red-gate.com/flyway"
    - title: "Erste Schritte: Flyway Autopilot – Anleitung für Einsteiger"
      url: "https://documentation.red-gate.com/fd/first-steps-flyway-autopilot-a-beginners-guide-254152325.html"
    - title: "Community- vs. Enterprise-Edition"
      url: "https://www.red-gate.com/products/flyway/editions/"

monitor:
  name: "Redgate Monitor"
  tagline: "Volle Transparenz über Ihren gesamten Datenbankbestand"
  description: "Redgate Monitor bietet Echtzeitüberwachung und Alarmierung für SQL Server, PostgreSQL, Oracle, MongoDB und MySQL — egal ob On-Premise oder in der Cloud. Es gibt DBAs und Ops-Teams eine zentrale Übersicht, um Performance-Probleme zu erkennen, bevor sie Nutzer beeinträchtigen."
  features:
    global_dashboard:
      title: "Globales Dashboard"
      description: "Sehen Sie Ihren gesamten Datenbankbestand auf einer einzigen Seite. Egal ob SQL Server, Postgres, MongoDB, MySQL — egal ob On-Premise oder in der Cloud."
      link_url: "https://monitor.red-gate.com/GlobalDashboard"
      link_title: "Globales Dashboard öffnen"
      image: "/images/monitor/global-dashboard.png"
    server_overview:
      title: "Server-Übersichtsseite"
      description: "Zeitverlauf aller Ereignisse auf einem Server, mit aktueller und vergangener Performance und Events — verschieben Sie den Zeitrahmen, und alle Informationen werden aktualisiert. Zeigt, welche Abfragen verbessert werden könnten und wie (mit oder ohne KI). Sehr nützlich für die Ursachenanalyse (Root Cause Analysis)."
      image: "/images/monitor/server-overview.png"
    alerts:
      title: "Alarme"
      image: "/images/monitor/alerts.png"
      points:
        - title: "Alarm-Posteingang"
          text: "Alle Alarme, die eingegangen sind, über alle Server hinweg."
          url: "https://monitor.red-gate.com/Alerts/Inbox"
        - title: "Alarmkonfiguration bearbeiten"
          text: "Alarmschwellen ändern, um Alarmmüdigkeit zu vermeiden (kann für einige Alarme auch automatisch per Machine Learning erfolgen)."
          url: "https://monitor.red-gate.com/Configuration/Alerts/EditAlertConfigurations?baseMonitorName=RGMON-EC2-BM2&channelInstanceRefs=i&types=1%3A0&pairs=0%2C0&returnUrl=%2FConfiguration%2FAlerts"
        - title: "Benutzerdefinierte Metriken"
          text: "Brauchen Sie etwas Spezifisches? Erfassen und alarmieren Sie auf Basis eigener Metriken."
          url: "https://sqlmonitormetrics.red-gate.com/"
    enterprise:
      title: "Monitor Enterprise"
      image: "/images/monitor/enterprise.png"
      points:
        - title: "Daten-API"
          text: "Senden Sie Daten aus Monitor überallhin, wo Sie sie brauchen (z. B. PowerBI zur Analyse)."
        - title: "Hochverfügbarkeit"
          text: "Sichert eine unterbrechungsfreie Datenbanküberwachung."
        - title: "Berechtigungen"
          text: "Vollständiges Audit, wer welche Berechtigungen in Ihrem Bestand hat, inklusive Änderungshistorie."
          url: "https://monitor.red-gate.com/Security/Permissions"
        - title: "Konfigurations-Compliance"
          text: "Prüfen Sie leicht, welche Server/Datenbanken konform sind und welche nicht."
          url: "https://monitor.red-gate.com/Security/ConfigurationCompliance"
  demo_servers:
    - platform: "SQL Server"
      name: "Demo – Workload01"
