en:
  products:
    flyway:
      name: "Redgate Flyway"
      tagline: "Database migrations made easy"
      description: "Flyway is an open-source database migration tool that lets teams version control their database schema changes alongside application code. It supports a wide range of databases and integrates with CI/CD pipelines."
      features:
        - "Version control for database schemas"
        - "Works with SQL Server, PostgreSQL, MySQL, Oracle and more"
        - "CLI, Maven, Gradle, and API integrations"
        - "Undo and repeatable migrations"
        - "Teams & Enterprise editions with advanced features"
      audience: "DevOps engineers, DBAs, and development teams who need to manage database changes safely across environments."
      why_redgate: "Flyway is trusted by over 8 million developers worldwide. Redgate's enterprise edition adds policy enforcement, audit trails, and team collaboration features."

    monitor:
      name: "Redgate Monitor"
      tagline: "Full visibility into your entire database estate"
      description: "Redgate Monitor provides real-time monitoring and alerting for SQL Server, PostgreSQL, Oracle, MongoDB and MySQL — whether on-premise or in the cloud. It gives DBAs and ops teams a single pane of glass to catch performance issues before they impact users."
      features:
        global_dashboard:
          title: "Global Dashboard"
          description: "See your entire database estate on one page — all servers, all platforms, on-prem and cloud, at a glance."
        server_overview:
          title: "Server Overview"
          description: "A full timeline of everything that happened on a server. Drill into queries, wait stats, and use AI-assisted recommendations for root cause analysis."
        alerts:
          title: "Alerts"
          description: "Centralised alert inbox across all servers. Configure thresholds manually or let machine learning tune them automatically to avoid alert fatigue."
        enterprise:
          title: "Enterprise Features"
          description: "Data API for exporting to PowerBI, High Availability, full permissions audit, and configuration compliance benchmarking."
      platforms:
        - name: "SQL Server"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg"
        - name: "PostgreSQL"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/postgresql/postgresql-original.svg"
        - name: "Oracle"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/oracle/oracle-original.svg"
        - name: "MongoDB"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mongodb/mongodb-original.svg"
        - name: "MySQL"
          icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg"
      links:
        - title: "Global Dashboard — Online Demo"
          url: "https://monitor.red-gate.com"
        - title: "How Redgate Monitor Works"
          url: "https://documentation.red-gate.com/monitor14"
        - title: "Hardware & Performance Guidelines"
          url: "https://documentation.red-gate.com/monitor14/hardware-and-performance-guidelines"
        - title: "Self-hosted vs SaaS — What's the Difference?"
          url: "https://documentation.red-gate.com/monitor14/how-is-it-different-from-self-hosted-redgate-monitor-331352319.html"
      audience: "DBAs, infrastructure teams, and ops engineers responsible for database performance and availability across any platform."
      why_redgate: "Redgate Monitor supports more database platforms than any comparable tool, giving teams one place to monitor their entire estate — no matter the mix of SQL Server, Postgres, Oracle, MongoDB or MySQL."
    
    test_data_manager:
      name: "Redgate Test Data Manager"
      tagline: "Safe, realistic test data on demand"
      description: "Test Data Manager helps teams provision masked, compliant, and production-like data for testing — without exposing real customer data. It integrates with CI/CD to automate data provisioning."
      features:
        - "Data masking and anonymisation"
        - "Self-service test data provisioning"
        - "GDPR and compliance-ready"
        - "CI/CD pipeline integration"
        - "Supports SQL Server and Oracle"
      audience: "QA teams, developers, and compliance officers who need realistic test data without the risk of exposing PII."
      why_redgate: "Test Data Manager removes the bottleneck of waiting for safe test data, letting teams ship faster while staying compliant with data privacy regulations."

    toolbelt_essentials:
      name: "SQL Toolbelt Essentials"
      tagline: "The essential toolkit for SQL Server developers"
      description: "SQL Toolbelt Essentials bundles Redgate's most popular SQL Server tools — SQL Compare, SQL Data Compare, SQL Prompt, and more — into one cost-effective package for development teams."
      features:
        - "SQL Compare — schema comparison and deployment"
        - "SQL Data Compare — row-level data diffing"
        - "SQL Prompt — intelligent SQL autocomplete and formatting"
        - "SQL Search — find objects across databases"
        - "Bundled pricing for cost efficiency"
      audience: "SQL Server developers and DBAs who want Redgate's core productivity tools in a single bundle."
      why_redgate: "Toolbelt Essentials gives teams the tools they use every day at a bundled price, reducing time spent on manual, error-prone database tasks."